<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel administrativo para revisar, filtrar, validar y eliminar reportes ciudadanos.">
  <title>Gestión de Reportes - Observatorio del Agua</title>
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="accessibility.css">
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <header>
    <nav class="bg-white shadow flex justify-between items-center px-7 py-4" aria-label="Navegación de administración">
      <a href="home_admin.html" class="flex items-center space-x-2" aria-label="Observatorio del Agua, inicio panel de administración">
        <div class="bg-blue-700 p-2 rounded-lg text-white" aria-hidden="true">💧</div>
        <div>
          <span class="font-bold text-sm block">Observatorio</span>
          <span class="text-xs text-gray-600 block">panel administrativo</span>
        </div>
      </a>
      <ul class="flex space-x-6 text-sm">
        <li><a href="home_admin.html" class="text-gray-600 hover:text-blue-700 font-semibold">Dashboard</a></li>
        <li><a href="reportes.html" class="text-blue-700 font-semibold" aria-current="page">Reportes</a></li>
        <li><a href="admin-users.html" class="text-gray-600 hover:text-blue-700 font-semibold">Usuarios</a></li>
        <li><a href="admin-alertas.html" class="text-gray-600 hover:text-blue-700 font-semibold">Alertas</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="flex-1 px-8 md:px-16 py-10 overflow-y-auto">
    <div class="flex flex-col gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Gestión de reportes</h1>
        <p class="text-sm text-gray-600">Filtra, revisa, valida o elimina reportes inapropiados.</p>
      </div>

      <form id="filter-form" class="grid grid-cols-1 md:grid-cols-4 gap-3 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <div>
          <label for="filter-type" class="text-sm font-semibold text-gray-700">Tipo</label>
          <input id="filter-type" class="w-full border rounded-lg px-3 py-2" placeholder="Químico, residuos...">
        </div>
        <div>
          <label for="filter-location" class="text-sm font-semibold text-gray-700">Ubicación</label>
          <input id="filter-location" class="w-full border rounded-lg px-3 py-2" placeholder="Medellín...">
        </div>
        <div>
          <label for="filter-status" class="text-sm font-semibold text-gray-700">Estado</label>
          <select id="filter-status" class="w-full border rounded-lg px-3 py-2">
            <option value="">Todos</option>
            <option value="pending">Pendiente</option>
            <option value="validated">Validado</option>
            <option value="rejected">Rechazado</option>
          </select>
        </div>
        <button class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2 font-semibold min-h-[44px]">Aplicar filtros</button>
      </form>
    </div>

    <p class="text-sm text-gray-600 mb-4" id="count-status" role="status" aria-live="polite">Cargando reportes...</p>
    <div id="reports-list" class="space-y-4 max-w-4xl"></div>
  </main>

  <script>
    const API_URL = "http://localhost:5000/api";
    const statusLabel = {
      pending: "Pendiente",
      validated: "Validado",
      rejected: "Rechazado",
    };

    const statusClass = {
      pending: "bg-yellow-100 text-yellow-800",
      validated: "bg-green-100 text-green-800",
      rejected: "bg-gray-100 text-gray-700",
    };

    function renderEmptyState(message) {
      const list = document.getElementById("reports-list");
      list.innerHTML = `
        <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-200 text-gray-600">
          ${message}
        </div>
      `;
    }

    async function loadReports() {
      const params = new URLSearchParams();
      const type = document.getElementById("filter-type").value.trim();
      const location = document.getElementById("filter-location").value.trim();
      const status = document.getElementById("filter-status").value;
      if (type) params.set("contaminationType", type);
      if (location) params.set("location", location);
      if (status) params.set("status", status);

      try {
        const token = localStorage.getItem("token");
        const response = await fetch(`${API_URL}/reports?${params.toString()}`, {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!response.ok) throw new Error("No se pudieron cargar reportes.");
        const reports = await response.json();
        renderReports(reports);
      } catch {
        renderEmptyState("No se pudieron cargar los reportes. Revisa la conexión con el backend.");
      }
    }

    function renderReports(reports) {
      const list = document.getElementById("reports-list");
      list.innerHTML = "";
      document.getElementById("count-status").textContent = `${reports.length} reporte(s) encontrados`;

      if (!reports.length) {
        renderEmptyState("No hay reportes que coincidan con este filtro.");
        return;
      }

      reports
        .sort((a, b) => (b.urgency || 1) - (a.urgency || 1))
        .forEach((report) => {
          const normalizedStatus = (report.status || "pending").toLowerCase();
          const card = document.createElement("article");
          card.className = "bg-white rounded-xl p-5 shadow-sm border border-gray-200 flex flex-col md:flex-row md:items-center md:justify-between gap-4";
          card.innerHTML = `
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="bg-blue-700 text-white text-xs font-bold w-7 h-7 rounded-full flex items-center justify-center">${report.urgency || 1}</span>
                <h2 class="text-base font-bold text-gray-800">${report.title || "Reporte sin título"}</h2>
              </div>
              <p class="text-sm text-gray-600">${report.contaminationType || "Sin tipo"} · ${report.address || "Sin ubicación"}</p>
              <span class="inline-flex mt-2 px-2.5 py-1 rounded-full text-xs font-semibold ${statusClass[normalizedStatus] || statusClass.pending}">
                ${statusLabel[normalizedStatus] || normalizedStatus}
              </span>
            </div>
            <div class="flex flex-wrap gap-2">
              <a class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold hover:no-underline" href="reporte-detalle.html?id=${report._id}">Detalle</a>
              <button class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded-lg font-semibold" data-validate="${report._id}" ${normalizedStatus === 'validated' ? 'disabled' : ''}>Validar</button>
              <button class="bg-red-700 hover:bg-red-800 text-white px-4 py-2 rounded-lg font-semibold" data-delete="${report._id}">Eliminar</button>
            </div>
          `;
          list.appendChild(card);
        });

      list.querySelectorAll("[data-validate]").forEach((button) => {
        button.addEventListener("click", async () => {
          if (button.dataset.validate.startsWith("demo")) return;
          const token = localStorage.getItem("token");
          await fetch(`${API_URL}/reports/${button.dataset.validate}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json", 
            "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ status: "validated" })
          });
          await loadReports();
        });
      });

      list.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", async () => {
          if (!confirm("¿Eliminar este reporte?")) return;
          if (button.dataset.delete.startsWith("demo")) return;
          const token = localStorage.getItem("token");
          await fetch(`${API_URL}/reports/${button.dataset.delete}`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${token}` }
          });
          await loadReports();
        });
      });
    }

    document.getElementById("filter-form").addEventListener("submit", (event) => {
      event.preventDefault();
      loadReports();
    });

    loadReports();
  </script>
</body>
</html>
