<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recupera la contraseña de tu cuenta en el Observatorio del Agua.">
  <title>Recuperar Contraseña - Observatorio del Agua</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="accessibility.css">
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center">

  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <main id="main" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">

    <!-- ICONO -->
    <div class="mb-4 flex justify-center">
      <div class="bg-yellow-700 p-4 rounded-xl" aria-hidden="true">
        <span class="text-white text-2xl">🔑</span>
      </div>
    </div>

    <!-- TITULO -->
    <h1 class="text-2xl font-bold mb-1">¿Olvidaste tu contraseña?</h1>
    <p class="text-gray-600 text-sm mb-6">
      Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
    </p>

    <!-- FORMULARIO -->
    <form class="space-y-4 text-left" id="recover-form" novalidate>

      <div>
        <label for="email" class="block text-sm font-medium">Correo electrónico <span aria-label="requerido">*</span></label>
        <input id="email" type="email" placeholder="usuario@email.com" required aria-required="true" aria-describedby="email-error"
          class="w-full border p-2 rounded-lg">
        <div id="email-error" class="error-message" role="alert" aria-live="polite"></div>
      </div>

      <button type="submit" class="w-full bg-blue-800 text-white py-2 rounded-lg hover:bg-blue-900 transition">
        Enviar enlace de recuperación
      </button>

    </form>

    <!-- VOLVER -->
    <p class="text-sm mt-4">
      <a href="login.html" class="text-blue-700 font-medium hover:underline">
        Volver al login
      </a>
    </p>

  </main>

<script>
function validateForm() {
  const email = document.getElementById("email");
  let isValid = true;

  const alerts = document.querySelectorAll('[role="alert"]');
  alerts.forEach(alertDiv => {
    if (alertDiv.id === "" || alertDiv.classList.contains("bg-red-100") || alertDiv.classList.contains("bg-green-100")) {
      alertDiv.remove();
    }
  });

  if (!email.value.trim()) {
    document.getElementById("email-error").textContent = "El correo electrónico es requerido";
    email.setAttribute("aria-invalid", "true");
    isValid = false;
  } else if (!email.validity.valid) {
    document.getElementById("email-error").textContent = "Por favor ingrese un correo válido";
    email.setAttribute("aria-invalid", "true");
    isValid = false;
  } else {
    document.getElementById("email-error").textContent = "";
    email.setAttribute("aria-invalid", "false");
  }

  return isValid;
}

document.getElementById("recover-form").addEventListener("submit", (e) => {
  e.preventDefault();
  
  if (!validateForm()) {
    return;
  }

  const successDiv = document.createElement("div");
  successDiv.setAttribute("role", "alert");
  successDiv.setAttribute("class", "bg-green-100 text-green-800 p-3 rounded-lg mb-4 text-center font-medium");
  successDiv.textContent = "Se ha enviado un enlace de recuperación a su correo electrónico ✉️";
  document.getElementById("recover-form").insertAdjacentElement("beforebegin", successDiv);
});
</script>
</body>
</html>
