<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visualiza reportes ciudadanos de contaminación hídrica en un mapa interactivo real.">
  <title>Mapa de Reportes - Observatorio del Agua</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="accessibility.css">
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <header>
    <nav class="bg-white shadow flex justify-between items-center px-8 py-4" aria-label="Navegación principal">
      <a href="index.html" class="flex items-center space-x-2" aria-label="Observatorio del Agua, ir a inicio">
        <div class="bg-blue-700 p-2 rounded-lg text-white" aria-hidden="true">💧</div>
        <span class="font-bold text-sm">Observatorio</span>
      </a>
      <ul class="flex space-x-4 text-sm">
        <li><a href="mapa.html" class="text-blue-700 font-semibold" aria-current="page">Mapa</a></li>
        <li><a href="descripcion.html" class="text-gray-600 hover:text-blue-700">Reporte</a></li>
        <li><a href="perfil.html" class="text-gray-600 hover:text-blue-700">Perfil</a></li>
        <li><a href="index.html" class="text-red-700 hover:underline" id="logout-link">Cerrar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="flex-1 flex flex-col">
    <section class="p-6 bg-white border-b border-gray-200" aria-labelledby="map-title">
      <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div>
          <h1 id="map-title" class="text-2xl font-bold text-gray-800">Mapa de reportes</h1>
          <p class="text-gray-600">Consulta reportes por tipo de contaminación y ubicación.</p>
        </div>
        <form id="filter-form" class="grid grid-cols-1 md:grid-cols-3 gap-3 w-full lg:max-w-3xl">
          <div>
            <label for="filter-type" class="text-sm font-semibold text-gray-700">Tipo</label>
            <select id="filter-type" class="w-full border rounded-lg px-3 py-2">
              <option value="">Todos</option>
              <option value="Residuos">Residuos</option>
              <option value="Aguas residuales">Aguas residuales</option>
              <option value="Químico">Químico</option>
              <option value="Industrial">Industrial</option>
            </select>
          </div>
          <div>
            <label for="filter-location" class="text-sm font-semibold text-gray-700">Ubicación</label>
            <input id="filter-location" class="w-full border rounded-lg px-3 py-2" placeholder="Medellín, quebrada...">
          </div>
          <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2 font-semibold min-h-[44px]">
            Filtrar
          </button>
        </form>
      </div>
    </section>

    <section class="p-6 flex-1 grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-6">
      <div id="map" class="rounded-xl shadow border border-gray-200 min-h-[520px]" role="application" aria-label="Mapa interactivo de reportes"></div>
      <aside class="bg-white rounded-xl shadow border border-gray-200 p-5 overflow-y-auto max-h-[520px]" aria-labelledby="reports-title">
        <h2 id="reports-title" class="text-lg font-bold text-gray-800 mb-4">Reportes encontrados</h2>
        <div id="reports-list" class="space-y-3" role="status" aria-live="polite">Cargando reportes...</div>
      </aside>
    </section>
  </main>

  <a href="descripcion.html" class="fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white text-3xl w-14 h-14 rounded-full shadow-lg flex items-center justify-center font-bold hover:no-underline focus:ring-4 focus:ring-blue-600 focus:outline-none" aria-label="Hacer un nuevo reporte">
    +
  </a>

  <script>
    const API_URL = "http://localhost:5000/api";
    const fallbackReports = [
      {
        _id: "demo-1",
        title: "Basuras en orilla - Quebrada La Iguaná",
        contaminationType: "Residuos sólidos",
        address: "Medellín, Antioquia",
        urgency: 3,
        status: "pending",
        location: { latitude: 6.266, longitude: -75.594 }
      },
      {
        _id: "demo-2",
        title: "Mortandad de peces - Embalse El Peñol",
        contaminationType: "Aguas residuales",
        address: "El Peñol, Antioquia",
        urgency: 4,
        status: "pending",
        location: { latitude: 6.218, longitude: -75.166 }
      }
    ];

    const map = L.map("map").setView([6.2442, -75.5812], 10);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let markers = L.layerGroup().addTo(map);

    document.getElementById("logout-link").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
    });

    async function loadReports() {
      const type = document.getElementById("filter-type").value;
      const location = document.getElementById("filter-location").value.trim();
      const params = new URLSearchParams();
      if (type) params.set("contaminationType", type);
      if (location) params.set("location", location);

      try {
        const response = await fetch(`${API_URL}/reports?${params.toString()}`);
        if (!response.ok) throw new Error("No se pudieron cargar reportes.");
        const reports = await response.json();
        renderReports(reports.length ? reports : fallbackReports);
      } catch {
        renderReports(fallbackReports);
      }
    }

    function renderReports(reports) {
      markers.clearLayers();
      const list = document.getElementById("reports-list");
      list.innerHTML = "";

      reports.forEach((report) => {
        const lat = report.location?.latitude || 6.2442;
        const lng = report.location?.longitude || -75.5812;
        const marker = L.marker([lat, lng], {
          alt: report.title || "Reporte ambiental",
          title: report.title || "Reporte ambiental"
        }).addTo(markers);
        marker.getElement()?.setAttribute("aria-label", report.title || "Reporte ambiental");
        marker.bindPopup(`
          <strong>${report.title}</strong><br>
          ${report.contaminationType || "Sin clasificar"}<br>
          <a href="reporte-detalle.html?id=${report._id}">Ver detalle</a>
        `);

        const item = document.createElement("article");
        item.className = "border border-gray-200 rounded-lg p-3";
        item.innerHTML = `
          <h3 class="font-semibold text-gray-800">${report.title}</h3>
          <p class="text-sm text-gray-600">${report.address || "Ubicación no especificada"}</p>
          <p class="text-sm text-gray-600">${report.contaminationType || "Sin clasificar"} · Urgencia ${report.urgency || 1}</p>
          <a class="inline-flex mt-2 text-blue-700 font-semibold" href="reporte-detalle.html?id=${report._id}">Ver detalle</a>
        `;
        list.appendChild(item);
      });

      if (reports.length) {
        const bounds = reports.map((report) => [report.location?.latitude || 6.2442, report.location?.longitude || -75.5812]);
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
      }
    }

    document.getElementById("filter-form").addEventListener("submit", (event) => {
      event.preventDefault();
      loadReports();
    });

    loadReports();
  </script>
</body>
</html>
