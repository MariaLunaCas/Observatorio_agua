<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">

    <!-- VOLVER AL HOME -->
    <div class="text-left mb-4">
      <a href="index.html" class="text-blue-600 text-sm">
        ← Volver 
      </a>
    </div>

    <!-- ICONO -->
    <div class="mb-4 flex justify-center">
      <div class="bg-blue-800 p-4 rounded-xl">
        <span class="text-white text-2xl">💧</span>
      </div>
    </div>

    <!-- TITULO -->
    <h1 class="text-2xl font-bold mb-1">Bienvenido</h1>
    <p class="text-gray-500 text-sm mb-6">
      Observatorio ciudadano del agua
    </p>

    <!-- FORMULARIO -->
    <form class="space-y-4 text-left">

      <div>
        <label class="block text-sm font-medium">Correo electrónico</label>
        <input id="email" type="email" placeholder="usuario@email.com"
          class="w-full border p-2 rounded-lg">
      </div>

      <div>
        <label class="block text-sm font-medium">Contraseña</label>
        <input id="password" type="password"
          class="w-full border p-2 rounded-lg">
      </div>

      <!-- RECUPERAR CONTRASEÑA -->
      <div class="text-right">
        <a href="Recuperarcontraseña.html" class="text-sm text-blue-600">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- BOTON LOGIN -->
      <button type="button"
        onclick="login()"
        class="w-full bg-blue-800 text-white py-2 rounded-lg hover:bg-blue-900">
        Iniciar sesión
      </button>
      <div class="text-center text-sm text-gray-500">O</div>

      
      <button type="button"
        onclick="window.location.href='home_admin.html'"
        class="w-full bg-blue-800 text-white py-2 rounded-lg hover:bg-blue-900" >Iniciar sesión como administrador</button>
        <!-- LOGIN GOOGLE -->
<a href="http://localhost:5000/api/auth/google"
  class="w-full border border-gray-300 py-2 rounded-lg flex items-center justify-center gap-3 hover:bg-gray-100 transition">

  <svg class="w-5 h-5" viewBox="0 0 48 48">
    <path fill="#EA4335"
      d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
    <path fill="#4285F4"
      d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <path fill="#FBBC05"
      d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
    <path fill="#34A853"
      d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
  </svg>

  Continuar con Google
</a>
    </form>
      

    <!-- LINK REGISTRO -->
    <p class="text-sm mt-4">
      ¿No tienes cuenta?
      <a href="registro.html" class="text-blue-600 font-medium">
        Regístrate
      </a>
    </p>

  </div>
<script>
const API_URL = "http://localhost:5000/api";

// ─────────────────────────────────────────
// AL CARGAR LA PAGINA
// ─────────────────────────────────────────
window.onload = () => {

  // Revisar si venimos del callback Google
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (token) {

    // Guardar JWT
    localStorage.setItem("token", token);

    // Decodificar payload JWT
    const payload = JSON.parse(atob(token.split('.')[1]));

    // Guardar usuario
    localStorage.setItem("user", JSON.stringify(payload));

    // Limpiar URL
    window.history.replaceState({}, document.title, "/");

    // Redireccionar
    if (payload.role === "admin") {
      window.location.href = "home_admin.html";
    } else {
      window.location.href = "home_loggeado.html";
    }
  }
};

// ─────────────────────────────────────────
// LOGIN NORMAL
// ─────────────────────────────────────────
async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {

    const response = await fetch(`${API_URL}/auth/login`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        password
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Error en el login");
    }

    console.log("Login OK:", data);

    // Guardar token JWT
    localStorage.setItem("token", data.access_token);

    // Guardar usuario
    localStorage.setItem("user", JSON.stringify(data.user));

    // Redireccionar según rol
    if (data.user.role === "admin") {
      window.location.href = "home_admin.html";
    } else {
      window.location.href = "home_loggeado.html";
    }

  } catch (error) {
    alert("Error: " + error.message);
  }
}
</script>
</body>
</html>
