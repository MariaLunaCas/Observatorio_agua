<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión en el Observatorio del Agua para hacer reportes y visualizar el mapa de contaminación hídrica.">
  <title>Iniciar Sesión - Observatorio del Agua</title>
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="accessibility.css">
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center">

  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <main id="main" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">

    <!-- VOLVER AL HOME -->
    <div class="text-left mb-4">
      <a href="index.html" class="text-blue-700 text-sm font-semibold" aria-label="Volver a la página de inicio">
        ← Volver 
      </a>
    </div>

    <!-- ICONO -->
    <div class="mb-4 flex justify-center">
      <div class="bg-blue-800 p-4 rounded-xl" aria-hidden="true">
        <span class="text-white text-2xl">💧</span>
      </div>
    </div>

    <!-- TITULO -->
    <h1 class="text-2xl font-bold mb-1">Bienvenido</h1>
    <p class="text-gray-600 text-sm mb-6">
      Observatorio ciudadano del agua
    </p>

    <!-- FORMULARIO -->
    <form class="space-y-4 text-left" id="login-form" novalidate>

      <div>
        <label for="email" class="block text-sm font-medium">Correo electrónico <span aria-label="requerido">*</span></label>
        <input 
          id="email" 
          type="email" 
          placeholder="usuario@email.com"
          required
          aria-required="true"
          aria-describedby="email-error"
          class="w-full border p-2 rounded-lg">
        <div id="email-error" class="error-message" role="alert" aria-live="polite"></div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium">Contraseña <span aria-label="requerido">*</span></label>
        <input 
          id="password" 
          type="password"
          required
          aria-required="true"
          aria-describedby="password-error"
          class="w-full border p-2 rounded-lg">
        <div id="password-error" class="error-message" role="alert" aria-live="polite"></div>
      </div>

      <!-- RECUPERAR CONTRASEÑA -->
      <div class="text-right">
        <a href="Recuperarcontraseña.html" class="text-sm text-blue-700 hover:underline">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- BOTON LOGIN -->
      <button 
        type="submit"
        class="w-full bg-blue-800 text-white py-2 rounded-lg hover:bg-blue-900">
        Iniciar sesión
      </button>

      <p class="text-center text-sm text-gray-600">
        El acceso administrativo requiere una cuenta aprobada por un validador.
      </p>
      
      <!-- LOGIN GOOGLE -->
      <a href="http://localhost:5000/api/auth/google"
        class="w-full border border-gray-300 py-2 rounded-lg flex items-center justify-center gap-3 hover:bg-gray-100 transition" 
        aria-label="Continuar con Google">

        <svg class="w-5 h-5" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05"
            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>

        <span>Continuar con Google</span>
      </a>
    </form>

    <!-- LINK REGISTRO -->
    <p class="text-sm mt-4 text-center">
      ¿No tienes cuenta?
      <a href="registro.html" class="text-blue-700 font-medium hover:underline">
        Regístrate
      </a>
    </p>

  </main>

<script>
const API_URL = "http://localhost:5000/api";

// Validación de formulario accesible
function validateForm() {
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  let isValid = true;

  if (!email.value) {
    document.getElementById("email-error").textContent = "El correo electrónico es requerido";
    email.setAttribute("aria-invalid", "true");
    isValid = false;
  } else if (!email.validity.valid) {
    document.getElementById("email-error").textContent = "Por favor ingrese un correo electrónico válido";
    email.setAttribute("aria-invalid", "true");
    isValid = false;
  } else {
    document.getElementById("email-error").textContent = "";
    email.setAttribute("aria-invalid", "false");
  }

  if (!password.value) {
    document.getElementById("password-error").textContent = "La contraseña es requerida";
    password.setAttribute("aria-invalid", "true");
    isValid = false;
  } else {
    document.getElementById("password-error").textContent = "";
    password.setAttribute("aria-invalid", "false");
  }

  return isValid;
}

// Manejar submit del formulario
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  
  if (!validateForm()) {
    return;
  }

  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;

  try {
    const response = await fetch(`${API_URL}/auth/login`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        password
      })
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      if (response.status === 401) {
        throw new Error(data.message || "Correo o contraseña incorrectos");
      }
      throw new Error(data.message || "Error en el login");
    }

    console.log("Login OK:", data);

    // Limpiar errores previos
    document.querySelectorAll('[data-form-alert="true"]').forEach((alert) => alert.remove());

    // Mostrar mensaje de éxito
    const successDiv = document.createElement("div");
    successDiv.setAttribute("role", "alert");
    successDiv.setAttribute("data-form-alert", "true");
    successDiv.setAttribute("class", "bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-4 rounded");
    successDiv.innerHTML = `
      <div class="font-bold">✅ Login Exitoso</div>
      <div class="text-sm">Redirigiendo a tu página...</div>
    `;
    
    const form = document.getElementById("login-form");
    form.insertAdjacentElement("beforebegin", successDiv);

    // Guardar token JWT
    localStorage.setItem("token", data.access_token);

    // Guardar usuario
    localStorage.setItem("user", JSON.stringify(data.user));

    // Redireccionar según rol (después de 1 segundo para que vea el mensaje)
    setTimeout(() => {
      if (data.user.role === "admin" || data.user.role === "validator") {
        window.location.href = "home_admin.html";
      } else {
        window.location.href = "home_loggeado.html";
      }
    }, 1000);

  } catch (error) {
    // Limpiar errores previos
    document.querySelectorAll('[data-form-alert="true"]').forEach((alert) => alert.remove());
    
    // Crear mensaje de error
    const errorDiv = document.createElement("div");
    errorDiv.setAttribute("role", "alert");
    errorDiv.setAttribute("data-form-alert", "true");
    errorDiv.setAttribute("class", "bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 rounded");
    errorDiv.innerHTML = `
      <div class="font-bold">❌ Error</div>
      <div class="text-sm">${error.message}</div>
    `;
    
    const form = document.getElementById("login-form");
    form.insertAdjacentElement("beforebegin", errorDiv);
    
    // Scroll al error
    errorDiv.scrollIntoView({ behavior: "smooth", block: "center" });
  }
});

// ─────────────────────────────────────────
// AL CARGAR LA PAGINA
// ─────────────────────────────────────────
window.onload = () => {

  // Revisar si venimos del callback Google
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (token) {

    // Guardar JWT
    localStorage.setItem("token", token);

    // Decodificar payload JWT
    const payload = JSON.parse(atob(token.split('.')[1]));

    // Guardar usuario
    localStorage.setItem("user", JSON.stringify(payload));

    // Limpiar URL
    window.history.replaceState({}, document.title, "/");

    // Redireccionar
    if (payload.role === "admin" || payload.role === "validator") {
      window.location.href = "home_admin.html";
    } else {
      window.location.href = "home_loggeado.html";
    }
  }
};
</script>
</body>
</html>
