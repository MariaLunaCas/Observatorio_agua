<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Perfil de usuario y gestión de reportes propios.">
  <title>Mi Perfil - Observatorio del Agua</title>
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="accessibility.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <a href="#main" class="skip-link">Saltar al contenido principal</a>

  <header class="bg-white border-b border-gray-100 shadow-sm flex items-center justify-between px-10 py-5">
    <a href="home_loggeado.html" id="back-link" class="font-semibold text-gray-700 text-lg hover:text-blue-700 transition">← Mi perfil</a>
    <a href="mapa.html" class="border-2 border-blue-700 text-blue-700 text-sm px-5 py-2 rounded-xl font-semibold hover:bg-blue-700 hover:text-white transition">Mapa</a>
  </header>

  <main id="main" class="flex flex-col md:flex-row flex-1 overflow-hidden">
    <section aria-label="Información del perfil" class="w-full md:w-80 bg-gradient-to-b from-blue-900 to-blue-700 text-white flex flex-col items-center justify-center py-12 px-8 gap-6">
      <div class="w-24 h-24 rounded-full bg-teal-700 flex items-center justify-center text-white text-3xl font-bold shadow-lg" id="avatar">US</div>
      <div class="text-center">
        <h1 class="text-xl font-bold" id="user-name">Usuario</h1>
        <p class="text-blue-200 text-sm mt-1" id="user-email"></p>
        <p class="text-blue-300 text-xs mt-1">Ciudadanía activa</p>
      </div>
      <dl class="flex gap-8 text-center w-full justify-center border-t border-blue-700 pt-6">
        <div>
          <dt class="text-4xl font-bold text-white" id="total-reports">0</dt>
          <dd class="text-xs text-blue-300 mt-1">Reportes</dd>
        </div>
        <div>
          <dt class="text-4xl font-bold text-teal-300" id="validated-reports">0</dt>
          <dd class="text-xs text-blue-300 mt-1">Validados</dd>
        </div>
      </dl>
    </section>

    <section aria-label="Reportes propios" class="flex-1 px-8 md:px-12 py-10 overflow-y-auto bg-gray-50">
      <div class="flex items-center justify-between gap-4 mb-6">
        <div>
          <h2 class="text-xl font-bold text-gray-800">Mis reportes</h2>
          <p class="text-sm text-gray-600">Edita o elimina los reportes que creaste.</p>
        </div>
        <a href="descripcion.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold hover:no-underline">Nuevo reporte</a>
      </div>

      <div id="status" class="mb-4 text-sm text-gray-600" role="status" aria-live="polite">Cargando reportes...</div>
      <ul id="reports-list" class="space-y-4"></ul>
    </section>
  </main>

  <div id="edit-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <form id="edit-form" class="bg-white rounded-xl shadow-xl p-6 w-full max-w-lg space-y-4">
      <h2 id="edit-title" class="text-xl font-bold text-gray-800">Editar reporte</h2>
      <input type="hidden" id="edit-id">
      <div>
        <label for="edit-report-title">Título</label>
        <input id="edit-report-title" class="w-full border rounded-lg px-3 py-2" required maxlength="100">
      </div>
      <div>
        <label for="edit-description">Descripción</label>
        <textarea id="edit-description" class="w-full border rounded-lg px-3 py-2" rows="4" required maxlength="200"></textarea>
      </div>
      <div>
        <label for="edit-type">Tipo de contaminación</label>
        <input id="edit-type" class="w-full border rounded-lg px-3 py-2" required maxlength="100">
      </div>
      <div class="flex gap-3 justify-end">
        <button type="button" id="cancel-edit" class="border border-gray-300 px-4 py-2 rounded-lg">Cancelar</button>
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold">Guardar</button>
      </div>
    </form>
  </div>

  <script>
    const API_URL = "http://localhost:5000/api";
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    const userEmail = user.email || "";
    const backLink = document.getElementById("back-link");

    if (user.role === "admin" || user.role === "validator") {
      backLink.href = "home_admin.html";
      backLink.textContent = "← Panel admin";
    }

    document.getElementById("user-name").textContent = user.name || user.email || "Usuario";
    document.getElementById("user-email").textContent = userEmail;
    document.getElementById("avatar").textContent = (userEmail || "US").slice(0, 2).toUpperCase();

    async function loadReports() {
      const status = document.getElementById("status");
      try {
        const response = await fetch(`${API_URL}/reports?createdBy=${encodeURIComponent(userEmail)}`);
        if (!response.ok) throw new Error("No se pudieron cargar tus reportes.");
        const reports = await response.json();
        renderReports(reports);
      } catch (error) {
        status.textContent = error.message;
      }
    }

    function renderReports(reports) {
      const list = document.getElementById("reports-list");
      list.innerHTML = "";
      document.getElementById("status").textContent = `${reports.length} reporte(s) encontrados`;
      document.getElementById("total-reports").textContent = reports.length;
      document.getElementById("validated-reports").textContent = reports.filter((report) => report.status === "validated").length;

      if (!reports.length) {
        list.innerHTML = `<li class="bg-white rounded-xl p-6 shadow-sm text-gray-600">Aún no tienes reportes creados.</li>`;
        return;
      }

      reports.forEach((report) => {
        const li = document.createElement("li");
        li.className = "bg-white rounded-xl px-6 py-4 shadow-sm border border-gray-200 flex flex-col md:flex-row md:items-center md:justify-between gap-4";
        li.innerHTML = `
          <div>
            <h3 class="font-semibold text-gray-800">${report.title}</h3>
            <p class="text-sm text-gray-600">${report.contaminationType || "Sin tipo"} · ${report.status || "pending"}</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <a href="reporte-detalle.html?id=${report._id}" class="text-blue-700 font-semibold px-3 py-2">Detalle</a>
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg" data-edit="${report._id}">Editar</button>
            <button class="bg-red-700 hover:bg-red-800 text-white px-3 py-2 rounded-lg" data-delete="${report._id}">Eliminar</button>
          </div>
        `;
        list.appendChild(li);
      });

      list.querySelectorAll("[data-edit]").forEach((button) => {
        button.addEventListener("click", async () => {
          const response = await fetch(`${API_URL}/reports/${button.dataset.edit}`);
          const report = await response.json();
          document.getElementById("edit-id").value = report._id;
          document.getElementById("edit-report-title").value = report.title || "";
          document.getElementById("edit-description").value = report.description || "";
          document.getElementById("edit-type").value = report.contaminationType || "";
          document.getElementById("edit-modal").classList.remove("hidden");
          document.getElementById("edit-modal").classList.add("flex");
        });
      });

      list.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", async () => {
          if (!confirm("¿Eliminar este reporte?")) return;
          await fetch(`${API_URL}/reports/${button.dataset.delete}`, { method: "DELETE" });
          loadReports();
        });
      });
    }

    document.getElementById("cancel-edit").addEventListener("click", () => {
      document.getElementById("edit-modal").classList.add("hidden");
      document.getElementById("edit-modal").classList.remove("flex");
    });

    document.getElementById("edit-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = document.getElementById("edit-id").value;
      await fetch(`${API_URL}/reports/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: document.getElementById("edit-report-title").value.trim(),
          description: document.getElementById("edit-description").value.trim(),
          contaminationType: document.getElementById("edit-type").value.trim()
        })
      });
      document.getElementById("edit-modal").classList.add("hidden");
      document.getElementById("edit-modal").classList.remove("flex");
      loadReports();
    });

    loadReports();
  </script>
</body>
</html>
